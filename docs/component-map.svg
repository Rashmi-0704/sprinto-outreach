<text x="1831.0" y="975.0" text-anchor="middle" font-size="18" fill="#1a2440">Gmail sends to YOUR</text>
<text x="1831.0" y="1001.0" text-anchor="middle" font-size="18" fill="#1a2440">inbox only; Neon saves</text>
<text x="1831.0" y="1027.0" text-anchor="middle" font-size="18" fill="#1a2440">every decision + quote</text>
