<circle cx="482" cy="1279" r="14" fill="#1f2a44"/><text x="482" y="1285" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="504" y="1285" font-size="18" fill="#1a2440">Extract</text>
<circle cx="710" cy="1279" r="14" fill="#1f2a44"/><text x="710" y="1285" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="732" y="1285" font-size="18" fill="#1a2440">Qualify</text>
<circle cx="938" cy="1279" r="14" fill="#1f2a44"/><text x="938" y="1285" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="960" y="1285" font-size="18" fill="#1a2440">Find contact</text>
<circle cx="1166" cy="1279" r="14" fill="#1f2a44"/><text x="1166" y="1285" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="1188" y="1285" font-size="18" fill="#1a2440">Pain points</text>
<circle cx="1394" cy="1279" r="14" fill="#1f2a44"/><text x="1394" y="1285" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="1416" y="1285" font-size="18" fill="#1a2440">Draft</text>
<circle cx="1622" cy="1279" r="14" fill="#1f2a44"/><text x="1622" y="1285" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text><text x="1644" y="1285" font-size="18" fill="#1a2440">Send</text>
<text x="48" y="1325" font-size="17" fill="#4b5570">Dashed arrow = data moving between parts · Green dotted = feedback loop · Code decides every gate; Gemini only reads and writes · Emails go only to your own inbox, never the prospect.</text>
<text x="48" y="1355" font-size="17" fill="#4b5570">Anything the rules cannot settle (no contact, unclear stage, failed validator check) waits for you in the review queue or drafts — nothing is guessed.</text>
